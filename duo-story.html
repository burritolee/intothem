<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="전구사람을 함께 만드는 두 사람의 작업 기록">
  <title>둘이 만드는 이야기 | 전구사람</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500&amp;display=swap" rel="stylesheet">
  <style>
    @font-face { font-family:"YoonChildfundkoreaMinGuk"; src:url("assets/YoonChildfundkoreaMinGuk.otf") format("opentype"); font-style:normal; font-weight:400; font-display:swap; }
    :root { color-scheme:light; --ink:#3c3932; }
    * { box-sizing:border-box; }
    body { min-height:100vh; min-height:100dvh; margin:0; display:grid; place-items:center; background:#0e0e0e; color:var(--ink); font-family:"YoonChildfundkoreaMinGuk",cursive; }
    .paper-shell {
      width:min(1057px,100vw,71.035vh);
      aspect-ratio:1057 / 1488;
      margin:0;
    }
    .sheet {
      position:relative;
      width:100%;
      height:100%;
      container-type:inline-size;
      background:#f0f1f0 url("assets/duo-story-paper-rough.png") center / 100% 100% no-repeat;
    }
    .page-head { position:absolute; top:8.3%; left:11.5%; margin:0; }
    h1 { margin:0; font:400 4.2cqw/1.15 "YoonChildfundkoreaMinGuk",cursive; letter-spacing:.01em; transform:rotate(-3deg); }
    .story-row {
      position:absolute;
      left:11.5%;
      right:7.5%;
      height:18%;
      display:grid;
      grid-template-columns:25% minmax(0,1fr);
      column-gap:6%;
      align-items:center;
    }
    .story-row:nth-of-type(1) { top:16.2%; --tilt:-2deg; --tape:#e8d6b6; --tape-angle:-7deg; }
    .story-row:nth-of-type(2) { top:34.5%; --tilt:2.3deg; --tape:#d7d8bc; --tape-angle:5deg; }
    .story-row:nth-of-type(3) { top:52.8%; --tilt:-1.8deg; --tape:#e5cfc6; --tape-angle:-4deg; }
    .story-row:nth-of-type(4) { top:71.1%; --tilt:2deg; --tape:#d6dbd0; --tape-angle:7deg; }
    .story-row--right { grid-template-columns:minmax(0,1fr) 25%; }
    .story-row--right .photo-print { grid-column:2; grid-row:1; }
    .story-row--right .story-space { grid-column:1; grid-row:1; }
    .story-space { min-width:0; }
    .story-copy { font:400 clamp(10.5px,2.7cqw,25px)/1.47 "YoonChildfundkoreaMinGuk",cursive; letter-spacing:0; overflow-wrap:break-word; word-break:keep-all; transform:rotate(-.6deg); }
    .story-row--right .story-copy { text-align:right; transform:rotate(.6deg); }
    .story-copy p { margin:0 0 .55em; }
    .story-copy p:last-child { margin-bottom:0; }
    .photo-print { position:relative; width:100%; margin:0; transform:rotate(var(--tilt)); filter:drop-shadow(0 .8cqw 1.2cqw rgba(61,51,40,.2)); }
    .photo-paper {
      padding:1cqw 1cqw 2.25cqw;
      background:linear-gradient(145deg,#fffdf8 0%,#f5efe3 100%);
      clip-path:polygon(.4% .5%,9% 0,19% .35%,30% .1%,42% .45%,53% .08%,65% .4%,77% .05%,88% .35%,99.5% .1%,100% 12%,99.65% 25%,100% 37%,99.7% 52%,100% 68%,99.6% 83%,100% 99.5%,88% 100%,75% 99.68%,62% 100%,49% 99.7%,36% 99.98%,22% 99.64%,10% 100%,.3% 99.5%,0 83%,.3% 67%,0 49%,.4% 31%,0 15%);
    }
    .photo-print img {
      display:block;
      width:100%;
      aspect-ratio:3 / 4;
      height:auto;
      object-fit:cover;
      clip-path:polygon(.5% .3%,10% 0,22% .4%,36% .1%,49% .4%,63% 0,77% .3%,90% 0,99.6% .4%,100% 17%,99.7% 34%,100% 53%,99.6% 73%,100% 99.5%,83% 100%,66% 99.7%,49% 100%,32% 99.6%,16% 100%,.4% 99.5%,0 81%,.3% 60%,0 40%,.4% 20%);
    }
    .tape { position:absolute; z-index:2; top:-1.2cqw; left:50%; display:block; width:9cqw; height:2.5cqw; opacity:.81; background:repeating-linear-gradient(92deg,rgba(255,255,255,.24) 0 2px,rgba(85,68,42,.04) 3px 4px),var(--tape); box-shadow:0 2px 5px rgba(54,44,31,.15); clip-path:polygon(0 7%,4% 0,95% 2%,100% 10%,98% 91%,94% 100%,5% 96%,0 89%); transform:translateX(-50%) rotate(var(--tape-angle)); }
    .page-foot { position:absolute; left:11.5%; bottom:4.3%; }
    .back-link { color:inherit; font:400 4.4cqw/1 "YoonChildfundkoreaMinGuk",cursive; text-decoration:none; }
    .back-link:hover,.back-link:focus-visible { color:#805b4a; }
  </style>
</head>
<body>
  <div class="paper-shell">
    <main class="sheet">
      <header class="page-head"><h1>둘이 만드는 이야기</h1></header>
      <section class="story-row story-row--left" aria-label="첫 번째 사진">
        <figure class="photo-print"><span class="tape" aria-hidden="true"></span><div class="photo-paper"><img src="assets/duo-story-04.jpg" width="3870" height="5160" alt="글입다 매장 외관과 입구" loading="eager" decoding="async"></div></figure>
        <div class="story-space"><div class="story-copy"><p>다이어리가 좋아하는 ‘문학 잉크’ 프로젝트를 진행하는 ‘글입다’의 오프라인 매장에 다녀왔어요.</p></div></div>
      </section>
      <section class="story-row story-row--right" aria-label="두 번째 사진">
        <figure class="photo-print"><span class="tape" aria-hidden="true"></span><div class="photo-paper"><img src="assets/duo-story-02.jpg" width="1688" height="2251" alt="서가 앞에서 책을 살펴보는 사람" loading="lazy" decoding="async"></div></figure>
        <div class="story-space"><div class="story-copy"><p>150가지가 넘는 잉크 색을 구경하느라 눈이 즐거웠어요.</p></div></div>
      </section>
      <section class="story-row story-row--left" aria-label="세 번째 사진">
        <figure class="photo-print"><span class="tape" aria-hidden="true"></span><div class="photo-paper"><img src="assets/duo-story-01.jpg" width="3024" height="4032" alt="테이블 위에 놓인 펜과 잉크 두 병" loading="lazy" decoding="async"></div></figure>
        <div class="story-space"><div class="story-copy"><p>펜촉에 잉크를 찍어 글을 쓰는 낭만을 즐기는 다이어리가 브리또에게 새로운 세계를 열어 주었네요.</p><p>브리또는 고민 끝에 펜과 잉크를 구매했어요. 잉크를 고르는 시간은 고민스러웠지만, 그만큼 행복했어요.</p></div></div>
      </section>
      <section class="story-row story-row--right" aria-label="네 번째 사진">
        <figure class="photo-print"><span class="tape" aria-hidden="true"></span><div class="photo-paper"><img src="assets/duo-story-03.jpg" width="4284" height="5712" alt="손에 든 잉크가 묻은 유리 펜촉" loading="lazy" decoding="async"></div></figure>
        <div class="story-space"><div class="story-copy"><p>인투뎀으로 돌아와 펜촉에 잉크를 찍어 글씨를 써 봤어요. 꺄! 여러분도 한 번 해 보세요.</p></div></div>
      </section>
      <footer class="page-foot"><a class="back-link" href="newsletter-sketch-preview.html" aria-label="표지로 돌아가기">←</a></footer>
    </main>
  </div>
</body>
</html>
